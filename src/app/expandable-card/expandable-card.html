<div class="ec" [class.flipped]="open()" [class.no-back]="!hasBack()">
  <button type="button"
          class="ec-inner"
          (click)="toggle()"
          [attr.aria-expanded]="open()"
          [attr.aria-label]="open() ? 'Réduire' : 'Voir le détail'">

    <!-- RECTO -->
    <div class="ec-face ec-front">
      <mat-icon *ngIf="icon" class="ec-icon">{{icon}}</mat-icon>
      <div class="ec-text">
        <h3 class="ec-title">{{title}}</h3>
        <p class="ec-summary" *ngIf="summary">{{summary}}</p>
      </div>
      <span class="ec-hint" aria-hidden="true">
        <ng-container *ngIf="hasBack()">↻</ng-container>
      </span>
    </div>

    <!-- VERSO (ng-content) -->
    <div class="ec-face ec-back" *ngIf="hasBack()">
      <div class="ec-back-content">
        <ng-content></ng-content>
      </div>
      <span class="ec-hint ec-hint-back" aria-hidden="true">↻</span>
    </div>
  </button>
</div>
