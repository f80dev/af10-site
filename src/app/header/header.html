<mat-toolbar class="header-toolbar">
  <a routerLink="/" class="brand">
    <span class="brand-mark">AF10</span>
    <span class="brand-text">Conseil &amp; logiciels métiers</span>
  </a>

  <nav class="nav-desktop">
    <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Accueil</a>
    <a mat-button routerLink="/realisations" routerLinkActive="active">Réalisations</a>
    <a mat-button routerLink="/services" routerLinkActive="active">Services</a>
    <a mat-button routerLink="/secteurs" routerLinkActive="active">Secteurs</a>
    <a mat-button routerLink="/a-propos" routerLinkActive="active">À propos</a>
  </nav>

  <a mat-flat-button color="primary" routerLink="/contact" class="cta-btn">Contact</a>

  <button mat-icon-button class="menu-btn" (click)="menuToggle.emit()" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>
